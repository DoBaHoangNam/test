<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Flexbox Page</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f4f4;
      padding: 20px;
    }

    /* Navbar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #333;
      padding: 15px 20px;
      color: white;
      flex-wrap: wrap;
    }

    .navbar h1 {
      font-size: 24px;
    }

    .nav-links {
      display: flex;
      gap: 15px;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 5px;
      transition: background 0.3s;
    }

    .nav-links a:hover {
      background-color: #555;
    }

    /* Main container */
    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: stretch;
      margin-top: 30px;
      gap: 20px;
    }

    .card {
      flex-grow: 1;          /* Cho phép phần tử mở rộng nếu còn không gian */
      flex-shrink: 1;        /* Cho phép phần tử co lại nếu thiếu không gian */
      flex-basis: calc(50% - 20px);  /* Độ rộng cơ bản ban đầu */
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: transform 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card h3 {
      margin-bottom: 15px;
      color: #333;
    }

    .card p {
      color: #555;
    }

    /* Responsive layout */
    @media (max-width: 768px) {
      .navbar {
        flex-direction: column;
        align-items: flex-start;
      }

      .container {
        flex-direction: column;
      }

      .card {
        flex: 1 1 100%;
      }
    }
  </style>
</head>
<body>

  <div class="navbar">
    <h1>My Dashboard</h1>
    <div class="nav-links">
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <h3>Card One</h3>
      <p>This is a flexible content card using Flexbox.</p>
    </div>
    <div class="card">
      <h3>Card Two</h3
